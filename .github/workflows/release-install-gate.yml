name: release-install-gate
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to gate (e.g. v1.0.13). Empty = dry-run.'
        required: false
        default: ''
        type: string

jobs:
  test-install-unix:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Run install pipe
        run: |
          # Yoodule/nimbus is the single source of truth for install.sh
          # — release.sh's step 11.5 (docs-sync) cp's it there on every
          # cut, and the same URL is what real `curl | bash` users hit.
          # The previous wimtorq-dev/ci copy drifted out of sync
          # (e.g. v1.0.12 install path = /var/folders/.../tmp.XXX bug
          # was only fixed in this repo's install.sh but not synced
          # to wimtorq-dev/ci/install.sh before the gate fired). One
          # URL, one source, no drift.
          curl -fsSL \
            "https://raw.githubusercontent.com/Yoodule/nimbus/main/install.sh?cb=$GITHUB_SHA" \
            | bash -s -- --no-auto-start

      - name: Capture install path
        id: install-path
        run: |
          # install.sh writes to $NIMBUS_HOME, defaulting to $HOME/.nimbus.
          # The same $HOME must be used in the start step. Detect the path
          # by looking for the .env that was just written.
          if [ -f "$HOME/.nimbus/.env" ]; then
            echo "nimbus_home=$HOME/.nimbus" >> "$GITHUB_OUTPUT"
          elif [ -f "/root/.nimbus/.env" ]; then
            echo "nimbus_home=/root/.nimbus" >> "$GITHUB_OUTPUT"
          else
            echo "::error::could not locate the install stub (.env)"
            ls -la "$HOME/.nimbus" 2>&1 || true
            ls -la /root/.nimbus 2>&1 || true
            exit 1
          fi

      - name: Pre-start cleanup (Linux only)
        if: runner.os == 'Linux'
        env:
          NIMBUS_HOME: ${{ steps.install-path.outputs.nimbus_home }}
        run: |
          # GitHub-hosted runners cache the docker daemon + its named volumes
          # across runs of this same workflow. A prior run that got past
          # `nimbus start` will have left `nimbus_redis_data`,
          # `nimbus_postgres_data`, etc. with the *prior* run's
          # REDIS_PASSWORD frozen in. The fresh install stub writes a new
          # REDIS_PASSWORD; the next `nimbus start` then aborts with
          # "volume is frozen under a different REDIS_PASSWORD". Wipe them.
          #
          # We do this AFTER the install (not before) because:
          #   1. install.sh provisions docker on Linux runners — the daemon
          #      isn't reliably up until install.sh finishes
          #   2. install.sh itself doesn't touch nimbus_* volumes, so the
          #      wipe is safe to do at either point — but doing it post-
          #      install lets us wait for the daemon and add diagnostics
          if ! command -v docker >/dev/null 2>&1; then
            echo "::error::docker not on PATH after install.sh — install.sh should have provisioned it"
            exit 1
          fi
          # Wait up to 60s for the daemon to be ready (it may be still
          # starting up; install.sh just provisioned it).
          for i in $(seq 1 30); do
            if docker info >/dev/null 2>&1; then
              echo "OK docker daemon is ready (waited ${i}x2s)"
              break
            fi
            sleep 2
          done
          if ! docker info >/dev/null 2>&1; then
            echo "::error::docker daemon did not become ready within 60s"
            docker info 2>&1 | head -20 || true
            exit 1
          fi
          # Diagnostics: log what we see BEFORE the wipe so the next run's
          # log shows whether the stale volume was actually present.
          echo "Volumes before wipe:"
          docker volume ls --format '  {{.Name}}' || true
          echo "Containers before wipe:"
          docker ps -a --format '  {{.Names}}' || true
          echo "Networks before wipe:"
          docker network ls --format '  {{.Name}}' | grep -i nimbus || echo "  (none)"
          # Wipe.
          docker ps -a --format '{{.Names}}' | grep -E 'gateway|qdrant|postgres|redis|nimbus' \
            | xargs -r docker rm -f 2>&1 || true
          docker volume ls --format '{{.Name}}' | grep -E '^nimbus_' \
            | xargs -r docker volume rm 2>&1 || true
          docker network ls --format '{{.Name}}' | grep -E 'nimbus' \
            | xargs -r docker network rm 2>&1 || true
          # Post-wipe diagnostics — confirm nothing nimbus-* remains.
          remaining=$(docker volume ls --format '{{.Name}}' | grep -E '^nimbus_' || true)
          if [ -n "$remaining" ]; then
            echo "::error::nimbus volumes still present after wipe: $remaining"
            exit 1
          fi
          echo "OK pre-start cleanup complete — no nimbus volumes remain"

      - name: Assert binary matches release tag
        run: |
          tag="${{ github.event.inputs.tag }}"
          if [ -z "$tag" ]; then
            echo "::warning::inputs.tag is empty (dry-run) - skipping version assertion"
            exit 0
          fi
          expected="${tag#v}"
          v=$("${{ steps.install-path.outputs.nimbus_home }}/nimbus" --version 2>&1 | tail -1)
          echo "Installed: $v  Expected: $expected"
          if ! echo "$v" | grep -q "$expected"; then
            echo "::error::nimbus --version did not report $expected"
            exit 1
          fi

      - name: Assert caller env is clean of NIMBUS_HOME leak
        run: |
          leaked=$(env -i PATH=/usr/bin:/bin bash -c 'printenv NIMBUS_HOME' 2>/dev/null || true)
          if [ -n "$leaked" ]; then
            echo "::error::NIMBUS_HOME leaked into a fresh subshell: '$leaked'"
            echo "::error::This is the v1.0.12 install path = /var/folders/.../tmp.XXX bug."
            exit 1
          fi
          echo "OK NIMBUS_HOME did not leak past the install pipe"

      - name: Start the gateway (Linux only)
        if: runner.os == 'Linux'
        env:
          NIMBUS_HOME: ${{ steps.install-path.outputs.nimbus_home }}
          # Pin to linux/amd64 on the gate's Ubuntu arm64 runner.
          # The compose's `platform: ${NIMBUS_HOST_ARCH:-linux/arm64}`
          # default would request arm64, but GHCR's arm64 manifest is
          # intermittently served inconsistently to anonymous pulls
          # (no matching manifest for linux/arm64) — see
          # https://github.com/wimtorq-dev/ci/actions/runs/30007921385.
          # test-install.yml has been hardcoding linux/amd64 here for
          # weeks and the Ubuntu leg has been green; the gate's macOS
          # leg (which uses the host's real arm64 arch) is what
          # validates the arm64 path. Pinning amd64 on the gate
          # aligns the two workflows and unblocks the cross-platform
          # install gate.
          NIMBUS_HOST_ARCH: linux/amd64
          # Skip the live OpenRouter key probe. The gate
          # pre-populates a dummy `sk-ci-dummy-not-real`
          # key into $NIMBUS_HOME/.env so the first-start
          # path runs end-to-end. The dummy is not a real
          # OpenRouter key, so the new live verifier
          # (added in CLI commit 3ce560c) correctly
          # returns 401 and would reject it — that
          # would break the gate, which is the opposite
          # of what we want (the gate tests install +
          # first-start, not OpenRouter auth). Setting
          # `NIMBUS_SKIP_KEY_VALIDATION=1` short-circuits
          # the verifier and trusts the pre-populated
          # key verbatim. CI-only — real users install
          # a real key and never see this path.
          NIMBUS_SKIP_KEY_VALIDATION: "1"
        run: |
          # nimbus reads OPENROUTER_API_KEY from $NIMBUS_HOME/.env, NOT from
          # the parent process env (proven by the v1.0.12 install path bug).
          # The install stub doesn't write the auto-generated secrets, so we
          # must backfill them in the file before nimbus will start.
          #
          # We also unset `CI` so the CLI banner renders the full brand
          # mark (icon + text-block + divider) instead of the text-only
          # fallback. The gate's job is to verify the user-facing
          # first-run experience, which includes the brand mark — see
          # the v1.0.0 missing-icon regression that the ioctl-width
          # fix landed for.
          unset CI
          env_file="$NIMBUS_HOME/.env"
          [ -w "$env_file" ] || chmod 0666 "$env_file" 2>/dev/null || true
          grep -q '^OPENROUTER_API_KEY=' "$env_file" \
            || echo 'OPENROUTER_API_KEY=sk-ci-dummy-not-real' >> "$env_file"
          grep -q '^QDRANT_API_KEY=' "$env_file" \
            || echo 'QDRANT_API_KEY=ci-dummy' >> "$env_file"
          grep -q '^VNC_PASSWORD=' "$env_file" \
            || echo 'VNC_PASSWORD=ci-dummy' >> "$env_file"
          grep -q '^GITHUB_PERSONAL_ACCESS_TOKEN=' "$env_file" \
            || echo 'GITHUB_PERSONAL_ACCESS_TOKEN=ci-dummy' >> "$env_file"
          # Last-chance diagnostic: confirm the volume is still absent at the
          # moment right before nimbus runs. The Pre-start cleanup step ran
          # ~tens of seconds ago and saw no nimbus_redis_data volume; if it
          # exists NOW, something between cleanup and start is recreating it
          # (a stale docker compose down? install.sh side-effect?).
          echo "Volumes right before nimbus start:"
          docker volume ls --format '  {{.Name}}' || true
          echo "Containers right before nimbus start:"
          docker ps -a --format '  {{.Names}}' || true
          if docker volume ls --format '{{.Name}}' | grep -qE '^nimbus_redis_data$'; then
            echo "::warning::nimbus_redis_data EXISTS right before start (the Pre-start cleanup missed it)"
            docker volume inspect nimbus_redis_data --format '{{ .CreatedAt }}' || true
          else
            echo "OK nimbus_redis_data is still absent right before nimbus start"
          fi
          "$NIMBUS_HOME/nimbus" start

      - name: Assert gateway container is running (Linux only)
        if: runner.os == 'Linux'
        run: |
          for i in $(seq 1 60); do
            if docker ps --format '{{.Names}}' | grep -q gateway; then
              echo "OK gateway container is up"
              docker ps
              exit 0
            fi
            sleep 2
          done
          echo "::error::gateway container did not start within 120s"
          docker ps -a >&2 || true
          docker logs gateway >&2 || true
          exit 1

      - name: Assert gateway /health is 200 (Linux only)
        if: runner.os == 'Linux'
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 2 \
              http://localhost:8088/health 2>/dev/null || echo 000)
            if [ "$code" = "200" ]; then
              echo "OK gateway /health returned 200"
              exit 0
            fi
            sleep 2
          done
          echo "::error::gateway /health never returned 200 (last code: $code)"
          exit 1

      - name: Stop the gateway (Linux only)
        if: runner.os == 'Linux'
        run: |
          # `nimbus stop` only stops containers; the named volumes persist
          # on the runner's docker daemon and would conflict with the next
          # run's fresh REDIS_PASSWORD. Run `nimbus uninstall --purge` so
          # the next dry-run on this same runner starts clean.
          "${{ steps.install-path.outputs.nimbus_home }}/nimbus" stop || true
          "${{ steps.install-path.outputs.nimbus_home }}/nimbus" uninstall --purge || true
          for i in $(seq 1 30); do
            if ! docker ps --format '{{.Names}}' | grep -qE 'gateway|qdrant|postgres|redis'; then
              echo "OK all nimbus containers stopped + volumes purged"
              exit 0
            fi
            sleep 2
          done
          echo "::error::nimbus stop left orphan containers:"
          docker ps
          exit 1

  test-install-windows:
    runs-on: windows-latest
    steps:
      - name: Run install.ps1 pipe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Yoodule/nimbus is the single source of truth for
          # install.ps1 — see the matching comment on the install.sh
          # pipe above.
          $url = "https://raw.githubusercontent.com/Yoodule/nimbus/main/install.ps1?cb=$env:GITHUB_SHA"
          $tmp = Join-Path $env:TEMP ("install-" + [Guid]::NewGuid() + ".ps1")
          Invoke-WebRequest -Uri $url -OutFile $tmp -UseBasicParsing
          & $tmp
          Remove-Item $tmp -Force

      - name: Assert nimbus.exe --version matches release tag
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if ([string]::IsNullOrEmpty($tag)) {
            Write-Warning "inputs.tag is empty (dry-run) - skipping version assertion"
            exit 0
          }
          $expected = $tag.TrimStart('v')
          $installDir = Join-Path $env:USERPROFILE ".nimbus"
          $exePath    = Join-Path $installDir "nimbus.exe"
          if (-not (Test-Path $exePath)) {
            Write-Error "nimbus.exe not installed at $exePath"
            exit 1
          }
          $v = & $exePath --version 2>&1 | Select-Object -Last 1
          if ($v -notmatch $expected) {
            Write-Error "nimbus.exe --version = '$v', expected to contain '$expected'"
            exit 1
          }
          Write-Host "OK nimbus.exe --version: $v"

      - name: Assert compose.yaml has live digest pin
        shell: pwsh
        run: |
          $composePath = Join-Path $env:USERPROFILE ".nimbus\compose.yaml"
          if (-not (Test-Path $composePath)) {
            Write-Error "compose.yaml not installed at $composePath"
            exit 1
          }
          $compose = Get-Content $composePath -Raw
          if ($compose -notmatch '@sha256:[a-f0-9]{64}') {
            Write-Error "compose.yaml gateway pin is not a sha256 digest - digest-refresh did not run"
            exit 1
          }
          Write-Host "OK compose.yaml has live digest pins"

      - name: Assert Defender exclusion is per-install
        shell: pwsh
        run: |
          $installDir = Join-Path $env:USERPROFILE ".nimbus"
          $exclusions = Get-ItemProperty `
            -Path 'HKLM:\SOFTWARE\Microsoft\Windows Defender\Exclusions\Paths' `
            -ErrorAction SilentlyContinue
          if (-not $exclusions) {
            Write-Warning "Defender exclusion key not found (Defender may not be enabled on this runner - non-fatal)"
            exit 0
          }
          # Filter out (a) PSObject built-in properties (PSPath, PSParentPath, ...)
          # and (b) pre-existing default exclusions that GitHub-hosted windows
          # runners come with (C:\, D:\). The check is: did install.ps1 ADD
          # a parent-path exclusion like the user's $env:USERPROFILE?
          $psProps = @('PSPath','PSParentPath','PSChildName','PSDrive','PSProvider')
          $defaultExclusions = @('C:\','D:\')
          $installAdded = @()
          foreach ($name in $exclusions.PSObject.Properties.Name) {
            if ($psProps -contains $name) { continue }
            if ($defaultExclusions -contains $name) { continue }
            # Is this a parent path of $installDir? i.e. a prefix that is
            # NOT installDir itself and ends with a path separator (or IS
            # USERPROFILE / a known-wrong root).
            if ($name -eq $env:USERPROFILE) {
              $installAdded += $name
            }
          }
          Write-Host "Defender exclusions added by install.ps1 that are parent paths:"
          if ($installAdded.Count -gt 0) {
            foreach ($p in $installAdded) { Write-Host "  - $p" }
            Write-Error "Defender exclusion includes a parent path: $($installAdded -join ', '). install.ps1 must scope to InstallDir only"
            exit 1
          }
          Write-Host "OK Defender exclusion is per-install (no parent-path exclusions)"

  auto-yank:
    needs: test-install-unix
    if: failure() && github.event.inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - name: Yank the broken release
        env:
          GH_TOKEN: ${{ secrets.WIMTORQ_GIT_PAT }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          echo "::error::Release $TAG failed the cross-platform install gate"
          echo "::error::Yanking release + tag from Yoodule/nimbus. OCI images stay on GHCR (re-push will re-tag)."
          # `gh release delete` accepts only ONE positional arg
          # (the tag). The cross-repo target MUST be passed via
          # `-R Yoodule/nimbus`, not as a second positional. The
          # previous form silently errored with "accepts 1 arg(s),
          # received 2" and the broken release stayed published.
          if gh release delete --yes -R Yoodule/nimbus "$TAG" --cleanup-tag; then
            echo "OK Yanked $TAG from Yoodule/nimbus"
          else
            rc=$?
            echo "::error::gh release delete failed (exit $rc) — broken $TAG is still published. Yank manually with: gh release delete --yes -R Yoodule/nimbus $TAG --cleanup-tag"
            exit $rc
          fi
