name: release-install-gate
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to gate (e.g. v1.0.13). Empty = dry-run.'
        required: false
        default: ''
        type: string

jobs:
  test-install-unix:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Run install pipe
        run: |
          curl -fsSL \
            "https://raw.githubusercontent.com/wimtorq-dev/ci/main/install.sh?cb=$GITHUB_SHA" \
            | bash -s -- --no-auto-start

      - name: Capture install path
        id: install-path
        run: |
          # install.sh writes to $NIMBUS_HOME, defaulting to $HOME/.nimbus.
          # The same $HOME must be used in the start step. Detect the path
          # by looking for the .env that was just written.
          if [ -f "$HOME/.nimbus/.env" ]; then
            echo "nimbus_home=$HOME/.nimbus" >> "$GITHUB_OUTPUT"
          elif [ -f "/root/.nimbus/.env" ]; then
            echo "nimbus_home=/root/.nimbus" >> "$GITHUB_OUTPUT"
          else
            echo "::error::could not locate the install stub (.env)"
            ls -la "$HOME/.nimbus" 2>&1 || true
            ls -la /root/.nimbus 2>&1 || true
            exit 1
          fi

      - name: Assert binary matches release tag
        run: |
          tag="${{ github.event.inputs.tag }}"
          if [ -z "$tag" ]; then
            echo "::warning::inputs.tag is empty (dry-run) - skipping version assertion"
            exit 0
          fi
          expected="${tag#v}"
          v=$("${{ steps.install-path.outputs.nimbus_home }}/nimbus" --version 2>&1 | tail -1)
          echo "Installed: $v  Expected: $expected"
          if ! echo "$v" | grep -q "$expected"; then
            echo "::error::nimbus --version did not report $expected"
            exit 1
          fi

      - name: Assert caller env is clean of NIMBUS_HOME leak
        run: |
          leaked=$(env -i PATH=/usr/bin:/bin bash -c 'printenv NIMBUS_HOME' 2>/dev/null || true)
          if [ -n "$leaked" ]; then
            echo "::error::NIMBUS_HOME leaked into a fresh subshell: '$leaked'"
            echo "::error::This is the v1.0.12 install path = /var/folders/.../tmp.XXX bug."
            exit 1
          fi
          echo "OK NIMBUS_HOME did not leak past the install pipe"

      - name: Start the gateway (Linux only)
        if: runner.os == 'Linux'
        env:
          NIMBUS_HOME: ${{ steps.install-path.outputs.nimbus_home }}
          OPENROUTER_API_KEY: sk-ci-dummy-not-real
          QDRANT_API_KEY: ci-dummy
          VNC_PASSWORD: ci-dummy
          GITHUB_PERSONAL_ACCESS_TOKEN: ci-dummy
        run: |
          # Source the install stub for any keys the install pipe populated
          set -a
          . "$NIMBUS_HOME/.env"
          set +a
          export OPENROUTER_API_KEY QDRANT_API_KEY VNC_PASSWORD GITHUB_PERSONAL_ACCESS_TOKEN
          "$NIMBUS_HOME/nimbus" start

      - name: Assert gateway container is running (Linux only)
        if: runner.os == 'Linux'
        run: |
          for i in $(seq 1 60); do
            if docker ps --format '{{.Names}}' | grep -q gateway; then
              echo "OK gateway container is up"
              docker ps
              exit 0
            fi
            sleep 2
          done
          echo "::error::gateway container did not start within 120s"
          docker ps -a >&2 || true
          docker logs gateway >&2 || true
          exit 1

      - name: Assert gateway /health is 200 (Linux only)
        if: runner.os == 'Linux'
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 2 \
              http://localhost:8088/health 2>/dev/null || echo 000)
            if [ "$code" = "200" ]; then
              echo "OK gateway /health returned 200"
              exit 0
            fi
            sleep 2
          done
          echo "::error::gateway /health never returned 200 (last code: $code)"
          exit 1

      - name: Stop the gateway (Linux only)
        if: runner.os == 'Linux'
        run: |
          "${{ steps.install-path.outputs.nimbus_home }}/nimbus" stop
          for i in $(seq 1 30); do
            if ! docker ps --format '{{.Names}}' | grep -qE 'gateway|qdrant|postgres|redis'; then
              echo "OK all nimbus containers stopped cleanly"
              exit 0
            fi
            sleep 2
          done
          echo "::error::nimbus stop left orphan containers:"
          docker ps
          exit 1

  test-install-windows:
    runs-on: windows-latest
    steps:
      - name: Run install.ps1 pipe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = "https://raw.githubusercontent.com/wimtorq-dev/ci/main/install.ps1?cb=$env:GITHUB_SHA"
          $tmp = Join-Path $env:TEMP ("install-" + [Guid]::NewGuid() + ".ps1")
          Invoke-WebRequest -Uri $url -OutFile $tmp -UseBasicParsing
          & $tmp
          Remove-Item $tmp -Force

      - name: Assert nimbus.exe --version matches release tag
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if ([string]::IsNullOrEmpty($tag)) {
            Write-Warning "inputs.tag is empty (dry-run) - skipping version assertion"
            exit 0
          }
          $expected = $tag.TrimStart('v')
          $installDir = Join-Path $env:USERPROFILE ".nimbus"
          $exePath    = Join-Path $installDir "nimbus.exe"
          if (-not (Test-Path $exePath)) {
            Write-Error "nimbus.exe not installed at $exePath"
            exit 1
          }
          $v = & $exePath --version 2>&1 | Select-Object -Last 1
          if ($v -notmatch $expected) {
            Write-Error "nimbus.exe --version = '$v', expected to contain '$expected'"
            exit 1
          }
          Write-Host "OK nimbus.exe --version: $v"

      - name: Assert compose.yaml has live digest pin
        shell: pwsh
        run: |
          $composePath = Join-Path $env:USERPROFILE ".nimbus\compose.yaml"
          if (-not (Test-Path $composePath)) {
            Write-Error "compose.yaml not installed at $composePath"
            exit 1
          }
          $compose = Get-Content $composePath -Raw
          if ($compose -notmatch '@sha256:[a-f0-9]{64}') {
            Write-Error "compose.yaml gateway pin is not a sha256 digest - digest-refresh did not run"
            exit 1
          }
          Write-Host "OK compose.yaml has live digest pins"

      - name: Assert Defender exclusion is per-install
        shell: pwsh
        run: |
          $installDir = Join-Path $env:USERPROFILE ".nimbus"
          $exclusions = Get-ItemProperty `
            -Path 'HKLM:\SOFTWARE\Microsoft\Windows Defender\Exclusions\Paths' `
            -ErrorAction SilentlyContinue
          if (-not $exclusions) {
            Write-Warning "Defender exclusion key not found (Defender may not be enabled on this runner - non-fatal)"
            exit 0
          }
          # Dump the registered exclusions so a CI failure is debuggable
          Write-Host "Registered Defender exclusions under HKLM Paths:"
          $registered = @()
          foreach ($name in $exclusions.PSObject.Properties.Name) {
            Write-Host "  - $name"
            $registered += $name
          }
          $dangerous = @($env:USERPROFILE, "C:\")
          $bad = $registered | Where-Object { $dangerous -contains $_ }
          if ($bad.Count -gt 0) {
            Write-Error "Defender exclusion includes a parent path: $($bad -join ', '). install.ps1 must scope to InstallDir only"
            exit 1
          }
          Write-Host "OK Defender exclusion is per-install (no parent-path exclusions)"

  auto-yank:
    needs: test-install-unix
    if: failure() && github.event.inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - name: Yank the broken release
        env:
          GH_TOKEN: ${{ secrets.WIMTORQ_GIT_PAT }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          echo "::error::Release $TAG failed the cross-platform install gate"
          echo "::error::Yanking release + tag from Yoodule/nimbus. OCI images stay on GHCR (re-push will re-tag)."
          gh release delete --yes Yoodule/nimbus "$TAG" --cleanup-tag
          echo "OK Yanked $TAG"
