name: Install tests

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-install-unix:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Run install.sh pipe
        run: |
          # We test that the install path works by fetching latest release.
          curl -fsSL "https://raw.githubusercontent.com/wimtorq-dev/ci/main/install.sh?cb=$GITHUB_SHA" | bash -s -- --no-auto-start

      - name: Verify installation
        run: |
          export NIMBUS_HOME="$HOME/.nimbus"
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            export NIMBUS_HOST_ARCH="linux/amd64" # Just in case it downloaded x86 on ARM macOS
          fi
          if [ ! -x "$NIMBUS_HOME/nimbus" ] && [ ! -x "$NIMBUS_HOME/nimbus-darwin-amd64" ] && [ ! -x "$NIMBUS_HOME/nimbus-darwin-arm64" ] && [ ! -x "$NIMBUS_HOME/nimbus-linux-amd64" ]; then
            echo "Binary not found!"
            exit 1
          fi
          echo "Installation verified!"
          ls -la "$NIMBUS_HOME"
          
          # Test nimbus start on Ubuntu (which has Docker daemon running)
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            echo "Testing nimbus start..."
            echo "OPENROUTER_API_KEY=dummy_key_for_ci" >> "$NIMBUS_HOME/.env"
            
            # The nimbus gateway images are currently arm64-only. 
            # We must install QEMU so the amd64 runner can run them via Docker.
            sudo apt-get update && sudo apt-get install -y qemu-user-static binfmt-support
            
            "$NIMBUS_HOME/nimbus" start
            echo "nimbus start succeeded!"
            "$NIMBUS_HOME/nimbus" stop
          fi

  test-install-windows:
    runs-on: windows-latest
    steps:
      - name: Run install.ps1 pipe
        shell: powershell
        run: |
          Invoke-RestMethod "https://raw.githubusercontent.com/wimtorq-dev/ci/main/install.ps1?cb=$env:GITHUB_SHA" | Invoke-Expression

      - name: Verify installation
        shell: powershell
        run: |
          $InstallDir = Join-Path $env:USERPROFILE ".nimbus"
          $ExePath = Join-Path $InstallDir "nimbus.exe"
          if (-not (Test-Path $ExePath)) {
              Write-Error "nimbus.exe not found!"
              exit 1
          }
          Write-Host "Installation verified!"
          Get-ChildItem $InstallDir
