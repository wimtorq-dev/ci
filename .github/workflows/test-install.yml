name: Install tests

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-install-unix:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Run install.sh pipe
        run: |
          # We test that the install path works by fetching latest release.
          curl -fsSL "https://raw.githubusercontent.com/wimtorq-dev/ci/main/install.sh?cb=$GITHUB_SHA" | bash -s -- --no-auto-start

      - name: Verify installation
        run: |
          export NIMBUS_HOME="$HOME/.nimbus"
          export PATH="$NIMBUS_HOME:$PATH"

          # 1. Binary must exist and be executable
          if [ ! -x "$NIMBUS_HOME/nimbus" ]; then
            echo "::error::nimbus binary not found or not executable!"
            exit 1
          fi
          echo "✅ Binary found"
          ls -la "$NIMBUS_HOME"

          # 2. Binary must actually run (not crash, not blocked)
          nimbus --help
          echo "✅ nimbus --help succeeded"

      - name: Test nimbus start (Ubuntu only)
        if: runner.os == 'Linux'
        run: |
          export NIMBUS_HOME="$HOME/.nimbus"
          export PATH="$NIMBUS_HOME:$PATH"
          export NIMBUS_HOST_ARCH="linux/amd64"

          echo "OPENROUTER_API_KEY=dummy_key_for_ci" >> "$NIMBUS_HOME/.env"

          nimbus start
          echo "✅ nimbus start succeeded"
          nimbus stop

  test-install-windows:
    runs-on: windows-latest
    steps:
      - name: Run install.ps1 pipe
        shell: powershell
        run: |
          Invoke-RestMethod "https://raw.githubusercontent.com/wimtorq-dev/ci/main/install.ps1?cb=$env:GITHUB_SHA" | Invoke-Expression

      - name: Verify installation
        shell: powershell
        run: |
          $InstallDir = Join-Path $env:USERPROFILE ".nimbus"
          $ExePath = Join-Path $InstallDir "nimbus.exe"

          # 1. Binary must exist
          if (-not (Test-Path $ExePath)) {
              Write-Error "nimbus.exe not found!"
              exit 1
          }
          Write-Host "✅ Binary found"
          Get-ChildItem $InstallDir

          # 2. Binary must actually run (not blocked by Defender)
          & $ExePath --help
          if ($LASTEXITCODE -ne 0) {
              Write-Error "nimbus.exe --help failed with exit code $LASTEXITCODE"
              exit 1
          }
          Write-Host "✅ nimbus --help succeeded"
