name: Install tests

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-install-unix:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Run install.sh pipe
        run: |
          # Use NIMBUS_VERSION to avoid hitting the GitHub API for latest release, 
          # which can hit rate limits in CI. We just test that the install path works.
          curl -fsSL https://raw.githubusercontent.com/wimtorq-dev/ci/main/install.sh | NIMBUS_VERSION=v1.0.12 bash -s -- --no-auto-start

      - name: Verify installation
        run: |
          export NIMBUS_HOME="$HOME/.nimbus"
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            export NIMBUS_HOST_ARCH="linux/amd64" # Just in case it downloaded x86 on ARM macOS
          fi
          if [ ! -x "$NIMBUS_HOME/nimbus" ] && [ ! -x "$NIMBUS_HOME/nimbus-darwin-amd64" ] && [ ! -x "$NIMBUS_HOME/nimbus-darwin-arm64" ] && [ ! -x "$NIMBUS_HOME/nimbus-linux-amd64" ]; then
            echo "Binary not found!"
            exit 1
          fi
          echo "Installation verified!"
          ls -la "$NIMBUS_HOME"

  test-install-windows:
    runs-on: windows-latest
    steps:
      - name: Run install.ps1 pipe
        shell: powershell
        run: |
          $env:NIMBUS_VERSION = "v1.0.12"
          Invoke-RestMethod https://raw.githubusercontent.com/wimtorq-dev/ci/main/install.ps1 | Invoke-Expression

      - name: Verify installation
        shell: powershell
        run: |
          $InstallDir = Join-Path $env:USERPROFILE ".nimbus"
          $ExePath = Join-Path $InstallDir "nimbus.exe"
          if (-not (Test-Path $ExePath)) {
              Write-Error "nimbus.exe not found!"
              exit 1
          }
          Write-Host "Installation verified!"
          Get-ChildItem $InstallDir
